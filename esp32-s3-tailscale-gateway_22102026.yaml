substitutions:
  name: "esp32-s3-tailscale-gateway"
  friendly_name: "ESP32-S3 Tailscale Gateway"
  revision: "22102026"

esphome:
  name: "${name}"
  friendly_name: "${friendly_name}"
  comment: "${friendly_name} by KAM-TECH Kamil Dziedziczak"
  project:
    name: "kamtech.esp32-s3-tailscale-gateway"
    version: "${revision}"

  on_boot:
    priority: -100
    then:
      # Ustawienie diody zgodnie z początkowym stanem połączenia.
      - script.execute: update_status_led
      - text_sensor.template.publish:
          id: esp_status
          state: "Normalny"
      # Publikacja aktualnej wersji ESPEMS.  
      - text_sensor.template.publish:
          id: espems_revision
          state: "${revision}"          
      - delay: 2s
      - lambda: |-
          std::string x = std::string(id(esp_log_level).current_option());
          esp_log_level_t level = ESP_LOG_WARN;

          if (x == "Wyłączone") {
            level = ESP_LOG_NONE;
          } else if (x == "Błędy") {
            level = ESP_LOG_ERROR;
          } else if (x == "Normalne") {
            level = ESP_LOG_WARN;
          } else if (x == "Diagnostyczne") {
            level = ESP_LOG_INFO;
          }

          esp_log_level_set("tailscale", level);
          esp_log_level_set("ml_coord", level);
          esp_log_level_set("ml_noise", level);
          esp_log_level_set("ml_h2", level);
          esp_log_level_set("ml_net_io", level);
          esp_log_level_set("ml_derp", level);
          esp_log_level_set("ml_peer_nvs", level);
          esp_log_level_set("ml_wg_mgr", level);
          esp_log_level_set("ml_stun", level);
          esp_log_level_set("microlink", level);
  
esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  flash_size: 16MB
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_LWIP_TCPIP_TASK_STACK_SIZE: "6144"
      CONFIG_LWIP_TCPIP_CORE_LOCKING: n

external_components:
  - source:
      type: git
      url: https://github.com/KamilDz1990/esphome-tailscale.git
      ref: main
    components:
      - tailscale
    refresh: 0s

psram:
  mode: octal
  speed: 80MHz

wifi:
  power_save_mode: none
 # ssid: !secret wifi_ssid
 # password: !secret wifi_password
  on_connect:
    - script.execute: update_status_led
  on_disconnect:
    - delay: 250ms
    - script.execute: update_status_led
  ap:
    ssid: "${name}"
    password: "1234567890"

captive_portal:
  
logger:
  level: INFO

debug:
  update_interval: 10s
  
api:
  reboot_timeout: 0s
  on_client_connected:
    - script.execute: update_status_led
  on_client_disconnected:
    - delay: 250ms
    - script.execute: update_status_led

ota:
  - platform: esphome

web_server:
  port: 80

# Obsługa diody RGB modułu ESP32-S3
light:

  - platform: esp32_rmt_led_strip
    id: status_led
    chipset: ws2812
    pin: GPIO48
    num_leds: 1
    rgb_order: GRB
    default_transition_length: 0s
    color_correct: [20%, 20%, 20%]
  
tailscale:
 # auth_key: !secret tailscale_auth_key
  hostname: "esp32-tailscale-gateway"
  max_peers: 16
  advertise_routes: "192.168.0.0/24"
  gateway_snat: true
  disable_telemetry: true

button:

  - platform: restart
    name: "Restart"
    icon: mdi:restart
    entity_category: diagnostic

# Ukryty przycisk fabrycznego resetu
  - platform: factory_reset
    name: "Reset ustawień"
    id: do_factory_reset
    internal: true
  
binary_sensor:

# Przycisk resetu sieci WiFi
  - platform: gpio
    pin:
      number: GPIO0
      inverted: true
    id: esp_reset
    filters:
      - delayed_on: 5s
    on_press:
      then:
        - text_sensor.template.publish:
            id: esp_status
            state: "Reset ustawień"
        - logger.log: "Resetuję preferencje – urządzenie wróci do trybu AP"
        - repeat:
            count: 5
            then:
              - light.turn_on: status_led
              - delay: 500ms
              - light.turn_off: status_led
              - delay: 500ms
        - delay: 5s
        - button.press: do_factory_reset  
  
  - platform: tailscale
    connected:
      name: "VPN Connected"
      icon: mdi:vpn
    subnet_router:
      name: "Subnet Router"
      icon: mdi:router-network

switch:
  - platform: tailscale
    vpn_enabled:
      name: "VPN Enabled"
      icon: mdi:vpn
      id: tailscale_vpn_enabled   

sensor:
  # Siła sygnału Wi-Fi
  - platform: wifi_signal
    name: "WiFi Signal"
    id: wifi_signal_db
    update_interval: 10s
    entity_category: diagnostic

  - platform: debug
    free:
      name: "Heap Free"
      entity_category: diagnostic

    block:
      name: "Heap Max Block"
      entity_category: diagnostic

    min_free:
      name: "Heap Min Free"
      entity_category: diagnostic

    fragmentation:
      name: "Heap Fragmentation"
      entity_category: diagnostic

    psram:
      name: "PSRAM Free"
      entity_category: diagnostic

    loop_time:
      name: "Loop Time"
      entity_category: diagnostic 

text:

  - platform: tailscale
    auth_key:
      name: "Tailscale Auth Key"
      id: tailscale_auth_key_web
      icon: mdi:key-variant
      mode: password
      
text_sensor:

  - platform: template
    name: "Wersja ESPEMS"
    id: espems_revision
    icon: mdi:tag-text-outline
    entity_category: diagnostic
    update_interval: never 

  - platform: template
    name: "Status"
    id: esp_status
    entity_category: diagnostic
    icon: mdi:information-outline
    update_interval: never
  
  - platform: wifi_info

    ip_address:
      name: "WiFi IP"
      id: wifi_ip
      icon: mdi:ip-network
      entity_category: diagnostic

    ssid:
      name: "WiFi SSID"
      icon: mdi:wifi
      entity_category: diagnostic

    mac_address:
      name: "WiFi MAC"
      icon: mdi:network-outline
      entity_category: diagnostic

  - platform: debug
    reset_reason:
      name: "Reset Reason"
      entity_category: diagnostic   

  # Uptime urządzenia
  - platform: uptime
    name: "Device Uptime"
    id: device_uptime
    icon: mdi:timer-check
    update_interval: 60s
    format:
      separator: " "
      days: " dni"
      hours: "h"
      minutes: "min"
    entity_category: diagnostic 
    
select:
  - platform: template
    name: "ESP_Log Level"
    id: esp_log_level
    icon: mdi:text-box-search-outline
    optimistic: true
    restore_value: true
    entity_category: diagnostic
    initial_option: "Normalne"

    options:
      - "Wyłączone"
      - "Błędy"
      - "Normalne"
      - "Diagnostyczne"

    set_action:
      - lambda: |-
          esp_log_level_t level = ESP_LOG_WARN;

          if (x == "Wyłączone") {
            level = ESP_LOG_NONE;
          } else if (x == "Błędy") {
            level = ESP_LOG_ERROR;
          } else if (x == "Normalne") {
            level = ESP_LOG_WARN;
          } else if (x == "Diagnostyczne") {
            level = ESP_LOG_INFO;
          }

          esp_log_level_set("tailscale", level);
          esp_log_level_set("ml_coord", level);
          esp_log_level_set("ml_noise", level);
          esp_log_level_set("ml_h2", level);
          esp_log_level_set("ml_net_io", level);
          esp_log_level_set("ml_derp", level);
          esp_log_level_set("ml_peer_nvs", level);
          esp_log_level_set("ml_wg_mgr", level);
          esp_log_level_set("ml_stun", level);
          esp_log_level_set("microlink", level);

script:

  - id: update_status_led
    mode: restart
    then:
      # Brak Wi-Fi
      - if:
          condition:
            not:
              wifi.connected: {}
          then:
            - light.turn_on:
                id: status_led
                red: 100%
                green: 0%
                blue: 0%  # 🔴 Brak WiFi
          else:
            # Wi-Fi i klient API połączone — pełna jasność.
            - if:
                condition:
                  api.connected: {}
                then:
                  - light.turn_on:
                      id: status_led
                      red: 0%
                      green: 100%
                      blue: 0%  # 🟢 API ok
                # Wi-Fi działa, ale nie ma klienta API.
                else:
                  - light.turn_on:
                      id: status_led
                      red: 0%
                      green: 0%
                      blue: 100%  # 🔵 Brak API

time:

  - platform: sntp
    id: sntp_time
    timezone: Europe/Warsaw                            