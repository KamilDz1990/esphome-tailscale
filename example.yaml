substitutions:
  name: "esp32-tailscale-gateway"
  friendly_name: "ESP32 Tailscale Gateway"

esphome:
  name: "${name}"
  friendly_name: "${friendly_name}"

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_LWIP_TCPIP_TASK_STACK_SIZE: "6144"
      CONFIG_LWIP_TCPIP_CORE_LOCKING: n

external_components:
  - source:
      type: git
      url: https://github.com/KamilDz1990/esphome-tailscale.git
      ref: main
    components:
      - tailscale
    refresh: 0s

psram:
  mode: octal
  speed: 80MHz

# No Wi-Fi credentials are required in the firmware.
# On first boot the fallback AP + captive portal can be used to configure Wi-Fi.
wifi:
  power_save_mode: none
  ap:
    ssid: "${name}"
    password: "change-me-123"

captive_portal:

logger:
  level: INFO

api:
  reboot_timeout: 0s

ota:
  - platform: esphome

web_server:
  port: 80

# No auth_key is required here.
# The key can be entered after boot through the Tailscale Auth Key text entity.
tailscale:
  hostname: "${name}"
  max_peers: 16
  advertise_routes: "192.168.0.0/24"
  gateway_snat: true
  disable_telemetry: true

text:
  - platform: tailscale
    auth_key:
      name: "Tailscale Auth Key"
      id: tailscale_auth_key_web
      icon: mdi:key-variant
      mode: password

binary_sensor:
  - platform: tailscale
    connected:
      name: "VPN Connected"
      icon: mdi:vpn
    subnet_router:
      name: "Subnet Router"
      icon: mdi:router-network

switch:
  - platform: tailscale
    vpn_enabled:
      name: "VPN Enabled"
      id: tailscale_vpn_enabled
      icon: mdi:vpn

sensor:
  - platform: wifi_signal
    name: "WiFi Signal"
    update_interval: 30s
    entity_category: diagnostic

text_sensor:
  - platform: wifi_info
    ip_address:
      name: "WiFi IP"
      entity_category: diagnostic
    ssid:
      name: "WiFi SSID"
      entity_category: diagnostic
    mac_address:
      name: "WiFi MAC"
      entity_category: diagnostic

  - platform: uptime
    name: "Device Uptime"
    icon: mdi:timer-check
    update_interval: 60s
    format:
      separator: " "
      days: " dni"
      hours: "h"
      minutes: "min"
    entity_category: diagnostic
